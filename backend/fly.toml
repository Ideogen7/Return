app = 'return-api'
primary_region = 'cdg'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  API_PREFIX = 'v1'
  LOG_LEVEL = 'info'
  # FIX-01/02 (short term): serve photo/avatar URLs from the public host instead
  # of the localhost default. NOTE: Fly containers are ephemeral — files under
  # /uploads are still lost on every redeploy. Persistence requires Cloudflare R2
  # (CORR-02 / docs/10_ROADMAP_CLOUDFLARE_R2.md).
  UPLOAD_BASE_URL = 'https://return-api.fly.dev/uploads'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
